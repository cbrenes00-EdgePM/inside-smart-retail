<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101C2C">
  <title>Thank you | INSIDE Smart Retail</title>
  <meta name="description" content="Thank you for contacting INSIDE Smart Retail.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/styles.css">
  <style>
    .success-wrap{min-height:100vh;display:grid;place-items:center;padding:32px;background:var(--midnight);color:#fff}
    .success-card{width:min(100%,650px);padding:clamp(32px,7vw,68px);border:1px solid rgba(255,255,255,.16);background:rgba(255,255,255,.045)}
    .success-card .eyebrow{color:var(--teal)}
    .success-card h1{font-size:clamp(42px,7vw,72px);line-height:1.02;margin:24px 0}
    .success-card h1 em{color:var(--lime);font-style:normal}
    .success-card p:not(.eyebrow){font-size:16px;color:#d6dde4;line-height:1.8;max-width:460px}
    .success-card .button{display:inline-flex;margin-top:22px}
  </style>
</head>
<body>
  <main class="success-wrap">
    <section class="success-card">
      <p class="eyebrow" data-es="MENSAJE RECIBIDO">MESSAGE RECEIVED</p>
      <h1 data-es="Gracias.<br><em>Pronto le contactaremos.</em>">Thank you.<br><em>We’ll be in touch.</em></h1>
      <p data-es="Hemos recibido su mensaje. El equipo de INSIDE agradece su interés y se comunicará con usted pronto.">Your message has been received. The INSIDE team appreciates your interest and will contact you soon.</p>
      <a class="button button-lime" href="/en/" data-es='Volver al inicio <span aria-hidden="true">→</span>'>Back to home <span aria-hidden="true">→</span></a>
    </section>
  </main>
  <script>
    (function () {
      var lang = null;
      try { lang = localStorage.getItem("inside-lang"); } catch (e) {}
      if (!lang) lang = (navigator.language || "").toLowerCase().indexOf("es") === 0 ? "es" : "en";
      if (lang !== "es") return;
      document.documentElement.lang = "es";
      document.title = "Gracias | INSIDE Smart Retail";
      document.querySelectorAll("[data-es]").forEach(function (el) { el.innerHTML = el.getAttribute("data-es"); });
      document.querySelector(".success-card .button").setAttribute("href", "/es/");
    })();
  </script>
</body>
</html>
